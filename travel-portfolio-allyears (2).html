<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Travel Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        :root {
            --ink: #0D0D0D;
            --paper: #F5F0E8;
            --accent: #C4622D;
            --accent2: #3D6B57;
            --muted: #8A7F72;
            --line: #D8CFBF;
            --card-bg: #FDFAF4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); overflow-x: hidden; }

        /* ── VIEWS ── */
        .view { display: none; }
        .view.active { display: block; }

        /* ══════════════════════════════════
           HOME VIEW
        ══════════════════════════════════ */
        .home-hero {
            min-height: 100vh;
            background: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
            position: relative;
            overflow: hidden;
        }
        .home-hero-bg {
            position: absolute;
            inset: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(12rem, 28vw, 26rem);
            font-weight: 700;
            color: rgba(255,255,255,0.025);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            letter-spacing: -0.05em;
        }
        .home-eyebrow {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.5rem;
            animation: fadeUp 1s ease both;
        }
        .home-hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3.5rem, 10vw, 9rem);
            font-weight: 700;
            color: var(--paper);
            line-height: 0.95;
            letter-spacing: -0.03em;
            animation: fadeUp 1s ease 0.1s both;
        }
        .home-hero p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            color: var(--muted);
            margin-top: 1.5rem;
            font-weight: 300;
            animation: fadeUp 1s ease 0.2s both;
        }
        .home-scroll-cue {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--muted);
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            animation: fadeUp 1s ease 0.4s both;
        }
        .home-scroll-line {
            width: 1px;
            height: 48px;
            background: linear-gradient(to bottom, var(--muted), transparent);
            animation: scrollPulse 2s ease infinite;
        }
        @keyframes scrollPulse {
            0% { transform: scaleY(0); transform-origin: top; }
            50% { transform: scaleY(1); transform-origin: top; }
            51% { transform: scaleY(1); transform-origin: bottom; }
            100% { transform: scaleY(0); transform-origin: bottom; }
        }

        /* Years Grid */
        .years-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 6rem 2rem 8rem;
        }
        .years-section-label {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .years-section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line);
        }
        .years-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }
        .year-card {
            background: var(--card-bg);
            border: 1px solid var(--line);
            padding: 2.5rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .year-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 0;
            background: var(--accent);
            transition: height 0.4s ease;
        }
        .year-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(13,13,13,0.1);
            border-color: var(--accent);
        }
        .year-card:hover::before { height: 100%; }
        .year-card-bg-num {
            position: absolute;
            right: -0.5rem;
            bottom: -1.5rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 8rem;
            font-weight: 700;
            color: rgba(13,13,13,0.04);
            line-height: 1;
            user-select: none;
        }
        .year-card-year {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1;
            margin-bottom: 0.8rem;
        }
        .year-card-stats {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .year-stat { display: flex; flex-direction: column; gap: 0.1rem; }
        .year-stat-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--accent);
            line-height: 1;
        }
        .year-stat-label {
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .year-card-destinations {
            font-size: 0.88rem;
            color: var(--muted);
            line-height: 1.6;
            font-style: italic;
        }
        .year-card-arrow {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            width: 38px;
            height: 38px;
            background: var(--ink);
            color: var(--paper);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            opacity: 0;
            transform: translateX(-8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .year-card:hover .year-card-arrow { opacity: 1; transform: translateX(0); }

        /* ══════════════════════════════════
           YEAR VIEW
        ══════════════════════════════════ */
        .year-view-header {
            background: var(--ink);
            padding: 3rem 2rem 4rem;
            position: relative;
            overflow: hidden;
        }
        .year-view-header-inner {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--paper);
            padding: 0.5rem 1.2rem;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); }
        .year-view-bg-num {
            position: absolute;
            right: -1rem;
            bottom: -2rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(10rem, 20vw, 18rem);
            font-weight: 700;
            color: rgba(255,255,255,0.03);
            line-height: 1;
            user-select: none;
        }
        .year-view-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(5rem, 14vw, 11rem);
            font-weight: 700;
            color: var(--paper);
            line-height: 0.9;
            letter-spacing: -0.03em;
        }
        .year-view-sub {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--muted);
            font-weight: 300;
            margin-bottom: 0.5rem;
        }
        .year-view-stats {
            display: flex;
            gap: 3rem;
            flex-wrap: wrap;
        }
        .year-view-stat-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--paper);
            display: block;
            line-height: 1;
        }
        .year-view-stat-label {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Month Nav */
        .month-nav {
            position: sticky;
            top: 0;
            background: rgba(245,240,232,0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
            z-index: 100;
            padding: 0 2rem;
        }
        .month-nav-inner {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 0;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .month-nav-inner::-webkit-scrollbar { display: none; }
        .month-nav-year {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .month-pills { display: flex; gap: 0.35rem; }
        .month-pill {
            padding: 0.3rem 0.85rem;
            border-radius: 999px;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
            white-space: nowrap;
            transition: all 0.2s ease;
            font-family: 'DM Sans', sans-serif;
        }
        .month-pill.has-trips { border-color: var(--accent); color: var(--accent); }
        .month-pill.has-trips:hover { background: var(--accent); color: white; border-color: var(--accent); }

        /* Timeline */
        .timeline-body {
            max-width: 1300px;
            margin: 0 auto;
            padding: 4rem 2rem 8rem;
        }
        .month-group { margin-bottom: 5rem; scroll-margin-top: 80px; }
        .month-label {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .month-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .month-divider { flex: 1; height: 1px; background: var(--line); }
        .month-trip-count { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
        .trips-row {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        /* Trip Card */
        .trip-card {
            background: var(--card-bg);
            border: 1px solid var(--line);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .trip-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(13,13,13,0.12);
            border-color: var(--accent);
        }
        .trip-cover {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
        }
        .trip-cover-placeholder {
            width: 100%;
            height: 210px;
            background: linear-gradient(135deg, #DDD5C5 0%, #C8BFAF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
        }
        .trip-card-body { padding: 1.4rem; }
        .trip-date-tag { font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; font-weight: 500; }
        .trip-title { font-family: 'Cormorant Garamond', serif; font-size: 1.7rem; font-weight: 600; color: var(--ink); line-height: 1.1; margin-bottom: 0.25rem; }
        .trip-subtitle { font-size: 0.82rem; color: var(--muted); font-style: italic; margin-bottom: 1rem; }
        .trip-album-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.72rem;
            color: var(--muted);
            border: 1px solid var(--line);
            padding: 0.22rem 0.65rem;
            border-radius: 999px;
        }
        .trip-card-arrow {
            position: absolute;
            bottom: 1.4rem;
            right: 1.4rem;
            width: 34px;
            height: 34px;
            background: var(--ink);
            color: var(--paper);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            opacity: 0;
            transform: translateX(-8px);
            transition: opacity 0.3s, transform 0.3s;
        }
        .trip-card:hover .trip-card-arrow { opacity: 1; transform: translateX(0); }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(13,13,13,0.97);
            z-index: 500;
            overflow-y: auto;
        }
        .modal.open { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-inner { max-width: 1100px; margin: 0 auto; padding: 5rem 2rem 4rem; }
        .modal-close {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.3s;
            z-index: 600;
        }
        .modal-close:hover { background: var(--accent); border-color: var(--accent); transform: rotate(90deg); }
        .modal-eyebrow { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.8rem; }
        .modal-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(3rem, 7vw, 5.5rem); font-weight: 700; color: var(--paper); line-height: 1; margin-bottom: 0.5rem; }
        .modal-meta { font-size: 1rem; color: var(--muted); font-style: italic; margin-bottom: 2.5rem; }
        .modal-story { border-left: 3px solid var(--accent); padding: 1.2rem 1.5rem; background: rgba(255,255,255,0.04); margin-bottom: 3rem; }
        .modal-story p { font-size: 1.05rem; line-height: 1.85; color: #B0A898; }
        .modal-photos-label { font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5rem; }
        .modal-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1rem; }
        .gallery-thumb { aspect-ratio: 4/3; overflow: hidden; cursor: pointer; position: relative; }
        .gallery-thumb img, .gallery-thumb video { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; display: block; }
        .gallery-thumb:hover img, .gallery-thumb:hover video { transform: scale(1.08); }
        .gallery-thumb-cap { position: absolute; bottom: 0; left: 0; right: 0; padding: 1.5rem 1rem 0.8rem; background: linear-gradient(transparent, rgba(0,0,0,0.72)); color: white; font-size: 0.78rem; opacity: 0; transition: opacity 0.3s; }
        .gallery-thumb:hover .gallery-thumb-cap { opacity: 1; }
        .no-photos { padding: 2.5rem; text-align: center; border: 1px dashed rgba(255,255,255,0.1); }
        .no-photos p { color: var(--muted); font-size: 0.92rem; line-height: 1.75; }
        .no-photos code { background: rgba(255,255,255,0.08); padding: 0.1em 0.4em; border-radius: 3px; font-size: 0.85em; color: var(--accent); }

        /* Itinerary Styles */
        .modal-itinerary {
            margin-top: 3rem;
            padding-top: 3rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .itinerary-label {
            font-size: 0.72rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 2rem;
        }
        .itinerary-timeline {
            position: relative;
            padding-left: 3rem;
        }
        .itinerary-timeline::before {
            content: '';
            position: absolute;
            left: 0.75rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--accent), transparent);
        }
        .itinerary-day {
            position: relative;
            margin-bottom: 3rem;
        }
        .itinerary-day::before {
            content: '';
            position: absolute;
            left: -2.25rem;
            top: 0.5rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            border: 3px solid var(--ink);
        }
        .itinerary-day-header {
            display: flex;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 0.8rem;
        }
        .itinerary-day-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent);
            line-height: 1;
        }
        .itinerary-day-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--paper);
            flex: 1;
        }
        .itinerary-day-date {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.05em;
        }
        .itinerary-activities {
            list-style: none;
            margin: 1rem 0;
        }
        .itinerary-activities li {
            padding: 0.4rem 0;
            color: #B0A898;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .itinerary-activities li::before {
            content: '→';
            color: var(--accent);
            margin-right: 0.5rem;
            font-weight: 600;
        }
        .itinerary-accommodation {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 0.5rem;
            padding: 0.3rem 0.8rem;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
        }
        .itinerary-accommodation::before {
            content: '🏨';
            font-size: 0.9rem;
        }
        .itinerary-notes {
            margin-top: 0.8rem;
            padding: 0.8rem 1rem;
            background: rgba(196, 98, 45, 0.1);
            border-left: 3px solid var(--accent);
            font-size: 0.88rem;
            color: #B0A898;
            font-style: italic;
            line-height: 1.6;
        }

        /* Lightbox */
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.97); z-index: 1000; align-items: center; justify-content: center; }
        .lightbox.open { display: flex; }
        .lightbox img, .lightbox video { max-width: 92vw; max-height: 92vh; object-fit: contain; }
        .lightbox-close { position: fixed; top: 1.5rem; right: 1.5rem; background: white; color: black; border: none; width: 42px; height: 42px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }

        /* ── MAP SECTION ── */
        .map-section {
            background: var(--ink);
            padding: 5rem 2rem;
        }
        .map-section-inner {
            max-width: 1200px;
            margin: 0 auto;
        }
        .map-label {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1rem;
        }
        .map-heading {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 600;
            color: var(--paper);
            margin-bottom: 0.5rem;
        }
        .map-subheading {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 2.5rem;
        }
        #travelMap {
            width: 100%;
            height: 500px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        /* Leaflet overrides to match dark theme */
        .leaflet-tile-pane { filter: grayscale(30%) brightness(0.85); }
        .leaflet-popup-content-wrapper {
            background: var(--ink);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            color: var(--paper);
        }
        .leaflet-popup-tip { background: var(--ink); }
        .leaflet-popup-content { margin: 1rem 1.2rem; }
        .map-popup-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--paper);
            margin-bottom: 0.2rem;
        }
        .map-popup-sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.5rem; }
        .map-popup-date { font-size: 0.72rem; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; }
        .map-pin-count {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 0.08em;
        }
        .map-pin-count span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: var(--paper);
            font-weight: 600;
        }

        /* Footer */
        footer { background: var(--ink); border-top: 1px solid rgba(255,255,255,0.06); padding: 2rem; text-align: center; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.05em; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 640px) {

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function initials(title) {
    return title.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

function countUnique(trips, field) {
    return new Set(trips.map(t => t[field])).size;
}

// ── HOME ──
function buildHome() {
    const grid = document.getElementById('yearsGrid');
    grid.innerHTML = '';
    // Sort newest first
    [...travelData].sort((a,b) => b.year - a.year).forEach(yd => {
        const destinations = yd.trips.map(t => t.title).join(' · ');
        const months = new Set(yd.trips.map(t => t.month)).size;
        const card = document.createElement('div');
        card.className = 'year-card';
        card.onclick = () => showYear(yd.year);
        card.innerHTML = `
            <div class="year-card-bg-num">${yd.year}</div>
            <div class="year-card-year">${yd.year}</div>
            <div class="year-card-stats">
                <div class="year-stat">
                    <span class="year-stat-num">${yd.trips.length}</span>
                    <span class="year-stat-label">Trips</span>
                </div>
                <div class="year-stat">
                    <span class="year-stat-num">${months}</span>
                    <span class="year-stat-label">Months</span>
                </div>
            </div>
            <p class="year-card-destinations">${destinations}</p>
            <div class="year-card-arrow">→</div>
        `;
        grid.appendChild(card);
    });
}

// ── YEAR VIEW ──
function showYear(year) {
    const yd = travelData.find(d => d.year === year);
    if (!yd) return;

    document.getElementById('view-home').classList.remove('active');
    document.getElementById('view-year').classList.add('active');
    window.scrollTo(0, 0);

    document.getElementById('yBgNum').textContent = year;
    document.getElementById('yTitle').textContent = year;
    document.getElementById('yTagline').textContent = yd.tagline || '';
    document.getElementById('yNavYear').textContent = year + ' Travels';
    document.getElementById('yFooter').textContent = `© ${year} · My Travel Portfolio`;

    // Stats
    const months = new Set(yd.trips.map(t => t.month)).size;
    document.getElementById('yStats').innerHTML = `
        <div><span class="year-view-stat-num">${yd.trips.length}</span><span class="year-view-stat-label">Trips</span></div>
        <div><span class="year-view-stat-num">${months}</span><span class="year-view-stat-label">Months</span></div>
    `;

    // Group by month
    const byMonth = {};
    yd.trips.forEach(t => { if (!byMonth[t.month]) byMonth[t.month] = []; byMonth[t.month].push(t); });

    // Month pills
    const pills = document.getElementById('yMonthPills');
    pills.innerHTML = '';
    MONTHS.forEach((name, i) => {
        const m = i + 1;
        const pill = document.createElement('button');
        pill.className = 'month-pill' + (byMonth[m] ? ' has-trips' : '');
        pill.textContent = name.slice(0,3);
        if (byMonth[m]) pill.onclick = () => document.getElementById(`m-${year}-${m}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        pills.appendChild(pill);
    });

    // Timeline
    const timeline = document.getElementById('yTimeline');
    timeline.innerHTML = '';
    Object.keys(byMonth).sort((a,b) => a-b).forEach(m => {
        const group = document.createElement('div');
        group.className = 'month-group';
        group.id = `m-${year}-${m}`;
        group.innerHTML = `
            <div class="month-label">
                <span class="month-name">${MONTHS[m-1]}</span>
                <div class="month-divider"></div>
                <span class="month-trip-count">${byMonth[m].length} trip${byMonth[m].length > 1 ? 's' : ''}</span>
            </div>
            <div class="trips-row"></div>
        `;
        const row = group.querySelector('.trips-row');
        byMonth[m].forEach(trip => {
            const card = document.createElement('div');
            card.className = 'trip-card';
            card.onclick = () => openModal(trip);
            card.innerHTML = `
                ${trip.cover
                    ? `<img class="trip-cover" src="${trip.cover}" alt="${trip.title}" loading="lazy">`
                    : `<div class="trip-cover-placeholder">${initials(trip.title)}</div>`}
                <div class="trip-card-body">
                    <p class="trip-date-tag">${trip.date}</p>
                    <h3 class="trip-title">${trip.title}</h3>
                    <p class="trip-subtitle">${trip.subtitle}</p>
                    ${trip.appleAlbum ? `<div class="trip-album-badge">📷 ${trip.appleAlbum}</div>` : ''}
                </div>
                <div class="trip-card-arrow">→</div>
            `;
            row.appendChild(card);
        });
        timeline.appendChild(group);
    });
}

function showHome() {
    document.getElementById('view-year').classList.remove('active');
    document.getElementById('view-home').classList.add('active');
    window.scrollTo(0, 0);
}

// ── MODAL ──
function openModal(trip) {
    document.getElementById('mDate').textContent = trip.date;
    document.getElementById('mTitle').textContent = trip.title;
    document.getElementById('mMeta').textContent = trip.subtitle;
    document.getElementById('mStory').innerHTML = `<p>${trip.story}</p>`;

    const gallery = document.getElementById('mGallery');
    const label = document.getElementById('mPhotosLabel');

    if (trip.gallery && trip.gallery.length > 0) {
        label.textContent = `Photos — ${trip.gallery.length} image${trip.gallery.length !== 1 ? 's' : ''}`;
        gallery.className = 'modal-gallery';
        gallery.innerHTML = trip.gallery.map(item => `
            <div class="gallery-thumb" onclick="openLightbox('${item.src}','${item.type || 'image'}')">
                ${item.type === 'video'
                    ? `<video src="${item.src}" muted loop></video>`
                    : `<img src="${item.src}" alt="${item.caption || ''}" loading="lazy">`}
                ${item.caption ? `<div class="gallery-thumb-cap">${item.caption}</div>` : ''}
            </div>
        `).join('');
    } else {
        label.textContent = '';
        const hint = trip.appleAlbum
            ? `Your photos are in Apple Photos album <code>"${trip.appleAlbum}"</code>.<br>Upload them to Imgur and add URLs to the <code>gallery</code> array for this trip.`
            : `Add photos by uploading to Imgur and adding URLs to the <code>gallery</code> array for this trip.`;
        gallery.className = '';
        gallery.innerHTML = `<div class="no-photos"><p>📷 No photos added yet.<br>${hint}</p></div>`;
    }

    // Add itinerary if present
    const itineraryContainer = document.getElementById('mItinerary');
    if (trip.itinerary && trip.itinerary.length > 0) {
        itineraryContainer.style.display = 'block';
        const itineraryHTML = trip.itinerary.map(day => `
            <div class="itinerary-day">
                <div class="itinerary-day-header">
                    <span class="itinerary-day-num">Day ${day.day}</span>
                    <span class="itinerary-day-title">${day.title}</span>
                    ${day.date ? `<span class="itinerary-day-date">${day.date}</span>` : ''}
                </div>
                <ul class="itinerary-activities">
                    ${day.activities.map(activity => `<li>${activity}</li>`).join('')}
                </ul>
                ${day.accommodation ? `<div class="itinerary-accommodation">${day.accommodation}</div>` : ''}
                ${day.notes ? `<div class="itinerary-notes">${day.notes}</div>` : ''}
            </div>
        `).join('');
        
        document.getElementById('mItineraryContent').innerHTML = itineraryHTML;
    } else {
        itineraryContainer.style.display = 'none';
    }

    document.getElementById('tripModal').classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    document.getElementById('tripModal').classList.remove('open');
    document.body.style.overflow = '';
}

function openLightbox(src, type) {
    event.stopPropagation();
    const c = document.getElementById('lightboxContent');
    c.innerHTML = type === 'video'
        ? `<video src="${src}" controls autoplay loop style="max-width:92vw;max-height:92vh;"></video>`
        : `<img src="${src}" style="max-width:92vw;max-height:92vh;object-fit:contain;">`;
    document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightboxContent').innerHTML = '';
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeLightbox(); }
});

function buildMap() {
    // Collect all trips across all years
    const allTrips = travelData.flatMap(yd =>
        yd.trips.map(t => ({ ...t, year: yd.year }))
    );

    // Deduplicate by location (group same place visited multiple times)
    const grouped = {};
    allTrips.forEach(trip => {
        const coords = destinationCoords[trip.id];
        if (!coords) return;
        const key = `${coords.lat},${coords.lng}`;
        if (!grouped[key]) grouped[key] = { coords, trips: [] };
        grouped[key].trips.push(trip);
    });

    const pinCount = Object.keys(grouped).length;
    document.getElementById('mapPinCount').textContent = pinCount;

    const map = L.map('travelMap', {
        center: [25, 15],
        zoom: 2,
        minZoom: 2,
        maxZoom: 12,
        zoomControl: true,
        scrollWheelZoom: false,
    });

    // Dark-toned map tiles
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors, © CARTO',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    // Custom pin icon
    function makeIcon(count) {
        return L.divIcon({
            className: '',
            html: `<div style="
                width: ${count > 1 ? 32 : 26}px;
                height: ${count > 1 ? 32 : 26}px;
                background: #C4622D;
                border: 2px solid #F5F0E8;
                border-radius: 50% 50% 50% 0;
                transform: rotate(-45deg);
                box-shadow: 0 3px 12px rgba(0,0,0,0.5);
                display: flex; align-items: center; justify-content: center;
            ">
                ${count > 1 ? `<span style="transform:rotate(45deg);color:white;font-size:10px;font-weight:600;">${count}</span>` : ''}
            </div>`,
            iconSize: [count > 1 ? 32 : 26, count > 1 ? 32 : 26],
            iconAnchor: [count > 1 ? 16 : 13, count > 1 ? 32 : 26],
            popupAnchor: [0, -28],
        });
    }

    Object.values(grouped).forEach(({ coords, trips }) => {
        const marker = L.marker([coords.lat, coords.lng], { icon: makeIcon(trips.length) });

        const popupHTML = trips.map(t => `
            <div style="margin-bottom:${trips.length > 1 ? '0.8rem' : '0'}; padding-bottom:${trips.length > 1 ? '0.8rem' : '0'}; border-bottom:${trips.length > 1 ? '1px solid rgba(255,255,255,0.1)' : 'none'}">
                <div class="map-popup-title">${t.title}</div>
                <div class="map-popup-sub">${t.subtitle}</div>
                <div class="map-popup-date">${t.date}</div>
            </div>
        `).join('');

        marker.bindPopup(`<div style="min-width:180px">${popupHTML}</div>`, {
            maxWidth: 260
        });

        marker.addTo(map);
    });
}
